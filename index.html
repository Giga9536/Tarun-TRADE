<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tracker PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1><i class="fas fa-wallet"></i> My Tracker</h1>
    </header>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('purchases')"><i class="fas fa-shopping-cart"></i><span>सामान</span></button>
        <button class="nav-btn" onclick="switchTab('expenses')"><i class="fas fa-money-bill-wave"></i><span>खर्च</span></button>
        <button class="nav-btn" onclick="switchTab('personal')"><i class="fas fa-user"></i><span>पर्सनल</span></button>
        <button class="nav-btn" onclick="switchTab('reminders')"><i class="fas fa-bell"></i><span>रिमाइंडर</span></button>
    </nav>

    <main id="app-content">
        <!-- सामान की खरीद -->
        <section id="purchases" class="tab-content active">
            <h2>सामान की खरीद</h2>
            <button class="btn-share" onclick="shareMonthlyReport('purchases')"><i class="fab fa-whatsapp"></i> पूरे महीने की रिपोर्ट शेयर करें</button>
            <form onsubmit="saveData(event, 'purchases')">
                <input type="hidden" id="purchases-id">
                <input type="text" id="purchases-desc" placeholder="सामान का नाम..." required>
                <input type="number" id="purchases-amt" placeholder="रकम (₹)" required>
                <input type="date" id="purchases-date" required>
                <label class="file-label">बिल/सामान की फोटो (Optional):</label>
                <input type="file" id="purchases-img" accept="image/*">
                <button type="submit" id="btn-purchases" class="btn-primary">सेव करें</button>
            </form>
            <div class="list-container" id="purchases-list"></div>
        </section>

        <!-- खर्च -->
        <section id="expenses" class="tab-content">
            <h2>सामान्य खर्च</h2>
            <button class="btn-share" onclick="shareMonthlyReport('expenses')"><i class="fab fa-whatsapp"></i> पूरे महीने की रिपोर्ट शेयर करें</button>
            <form onsubmit="saveData(event, 'expenses')">
                <input type="hidden" id="expenses-id">
                <input type="text" id="expenses-desc" placeholder="खर्च का विवरण..." required>
                <input type="number" id="expenses-amt" placeholder="रकम (₹)" required>
                <input type="date" id="expenses-date" required>
                <button type="submit" id="btn-expenses" class="btn-primary">सेव करें</button>
            </form>
            <div class="list-container" id="expenses-list"></div>
        </section>

        <!-- पर्सनल खर्च -->
        <section id="personal" class="tab-content">
            <h2>पर्सनल खर्च</h2>
            <!-- यहाँ से WhatsApp शेयर बटन हटा दिया गया है -->
            <form onsubmit="saveData(event, 'personal')">
                <input type="hidden" id="personal-id">
                <input type="text" id="personal-desc" placeholder="पर्सनल खर्च विवरण..." required>
                <input type="number" id="personal-amt" placeholder="रकम (₹)" required>
                <input type="date" id="personal-date" required>
                <button type="submit" id="btn-personal" class="btn-primary">सेव करें</button>
            </form>
            <div class="list-container" id="personal-list"></div>
        </section>

        <!-- रिमाइंडर -->
        <section id="reminders" class="tab-content">
            <h2>रिमाइंडर</h2>
            <form onsubmit="addReminder(event)">
                <input type="text" id="rem-title" placeholder="क्या याद दिलाना है?" required>
                <input type="datetime-local" id="rem-time" required>
                <button type="submit" class="btn-primary">रिमाइंडर सेट करें</button>
            </form>
            <div class="list-container" id="reminders-list"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
